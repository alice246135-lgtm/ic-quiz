<style>

:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --muted:#5b6878; --line:#d9dfe6;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#97a4b3; --line:#2c3743;
  --accent:#6fb0de; --accent-soft:#1d3245;

:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#97a4b3; --line:#2c3743;

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
header{padding-block:40px 20px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:6px 0 10px;text-wrap:balance}

.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tools{display:flex;gap:8px;margin-left:auto}

button.t[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.t:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px}
.q-head{display:flex;gap:12px;align-items:baseline}
.num{font-family:var(--mono);font-size:14px;color:var(--accent);flex:none;min-width:2.2em}
.stem{margin:0;font-weight:500;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:15px;line-height:1.6;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-size:13px;flex:none;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);margin-top:1px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}

.exp b{color:var(--ok)} .exp b.x{color:var(--bad)}
.done{margin-top:36px;padding:20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft)}
.done h3{font-family:var(--display);margin:0 0 4px;font-size:20px}
.done p{margin:0}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion: reduce){.meter i{transition:none}}
</style>

// deterministic shuffle so option letters stay the same across reloads
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const items = Q.map((q,i)=>{
  const r=rng(i*7919+31), idx=[0,1,2,3];
  for(let j=3;j>0;j--){const k=Math.floor(r()*(j+1));[idx[j],idx[k]]=[idx[k],idx[j]]}
  return {sec:q[0],stem:q[1],opts:idx.map(o=>q[2][o]),ans:idx.indexOf(q[3]),exp:q[4]};
});

const KEY="ic-quiz-p39";
let picks={};
try{picks=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){picks={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(picks))}catch(e){}};
let onlyWrong=false;
const L="ABCD";

function render(){
  const root=document.getElementById("quiz");root.innerHTML="";
  SECTIONS.forEach((name,s)=>{
    const list=items.map((it,i)=>({it,i})).filter(x=>x.it.sec===s)
      .filter(x=>!onlyWrong||(picks[x.i]!==undefined&&picks[x.i]!==x.it.ans));
    if(!list.length)return;
    const h=document.createElement("h2");
    const all=items.filter(it=>it.sec===s).length;
    h.innerHTML=`${name}<small>${all} 題</small>`;root.appendChild(h);
    const box=document.createElement("div");box.className="list";
    list.forEach(({it,i})=>box.appendChild(card(it,i)));
    root.appendChild(box);
  });
  if(onlyWrong&&!root.children.length){root.innerHTML='<p class="empty">目前沒有答錯的題目。</p>'}
  stats();
}
function card(it,i){
  const el=document.createElement("article");el.className="q";el.id="q"+(i+1);
  const p=picks[i];
  el.innerHTML=`<div class="q-head"><span class="num">${String(i+1).padStart(2,"0")}</span><p class="stem">${it.stem}</p></div>`;
  const opts=document.createElement("div");opts.className="opts";
  it.opts.forEach((o,k)=>{
    const b=document.createElement("button");b.className="opt";b.type="button";b.id=`q${i+1}o${k}`;
    b.innerHTML=`<span class="k">${L[k]}</span><span>${o}</span>`;
    if(p!==undefined){
      b.disabled=true;
      if(k===it.ans)b.classList.add("right");
      else if(k===p)b.classList.add("wrong");
      else b.classList.add("dim");
    }
    b.addEventListener("click",()=>{picks[i]=k;save();const n=card(it,i);el.replaceWith(n);stats()});
    opts.appendChild(b);
  });
  el.appendChild(opts);
  if(p!==undefined){
    const ok=p===it.ans, e=document.createElement("p");e.className="exp";
    e.innerHTML=(ok?'<b>答對</b>　':`<b class="x">答錯</b>　正確答案是 ${L[it.ans]}。`)+it.exp;
    el.appendChild(e);
  }
  return el;
}
function stats(){
  const done=Object.keys(picks).length;
  const ok=Object.entries(picks).filter(([i,k])=>items[i].ans===k).length;
  document.getElementById("sAns").textContent=done;
  document.getElementById("sOk").textContent=ok;
  document.getElementById("sBad").textContent=done-ok;
  document.getElementById("meter").style.width=(done/items.length*100)+"%";
  const d=document.getElementById("done");
  if(done===items.length){
    d.hidden=false;
    document.getElementById("doneTitle").textContent=`完成！得分 ${ok * 2} / 100`;
    document.getElementById("doneText").textContent=done-ok?`答錯 ${done-ok} 題。按上方「只看答錯」可以集中複習。`:"全部答對。";
  }else d.hidden=true;
}
document.getElementById("btnWrong").addEventListener("click",e=>{
  onlyWrong=!onlyWrong;e.currentTarget.setAttribute("aria-pressed",onlyWrong);render();
});
document.getElementById("btnReset").addEventListener("click",()=>{
  picks={};save();onlyWrong=false;document.getElementById("btnWrong").setAttribute("aria-pressed","false");render();window.scrollTo(0,0);
});
render();
</script>
